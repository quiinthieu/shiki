[workspace]
members = [
    "crates/sk-core",
    "crates/sk-store",
    "crates/sk-deliver",
    "crates/sk-import",
    "crates/shiki-term",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
authors = ["quiinthieu"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/quiinthieu/shiki"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
sk-core = { path = "crates/sk-core" }
sk-store = { path = "crates/sk-store" }
sk-deliver = { path = "crates/sk-deliver" }
sk-import = { path = "crates/sk-import" }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
rustix = { version = "1.0", features = ["event", "fs", "pty", "termios"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
assert_cmd = "2.0"
insta = "1.42"
proptest = { version = "1.6", default-features = false, features = ["std", "bit-set"] }
tempfile = "3.17"
