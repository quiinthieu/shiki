# Tunable parameters for Shiki's solar and colour model (`PLAN.md` §0 #9, §4).
#
# Do not invent numbers: every threshold here cites its published astronomical or perceptual source
# and is marked tunable when intended for user/model calibration.

[solar.event_angles]
# Sun-center geometric horizon altitude for sunrise and sunset (degrees, tunable).
# Default -0.833 deg combines ~34' standard atmospheric refraction and ~16' solar semi-diameter
# (zenith = 90.833 deg).
# Sources:
# - NOAA GML Solar Calculation Details: https://gml.noaa.gov/grad/solcalc/calcdetails.html
# - SunCalc (`mourner/suncalc`): `[-0.833, 'sunrise', 'sunset']`
sunrise_sunset_deg = -0.833

# Civil, nautical, and astronomical twilight sun-center altitudes (degrees, tunable).
# Defaults follow IAU / NOAA / SunCalc conventions (-6, -12, -18 deg).
# Sources:
# - NOAA GML Glossary & Calculation Details: https://gml.noaa.gov/grad/solcalc/calcdetails.html
# - SunCalc (`mourner/suncalc`): `-6` (`dawn`/`dusk`), `-12` (`nauticalDawn`/`nauticalDusk`), `-18` (`nightEnd`/`night`)
civil_twilight_deg = -6.0
nautical_twilight_deg = -12.0
astronomical_twilight_deg = -18.0

# Golden-hour upper sun-center altitude threshold (degrees, tunable).
# Source: SunCalc (`mourner/suncalc`): `[6, 'goldenHourEnd', 'goldenHour']`
golden_hour_deg = 6.0

[contrast]
# Minimum WCAG 2.2 contrast ratio for foreground/background and selection text (tunable;
# lowering below default requires `--i-know`, `PLAN.md` §4).
# Source: W3C WCAG 2.2 Success Criterion 1.4.3 Contrast (Minimum) (Level AA):
# https://www.w3.org/TR/WCAG22/#contrast-minimum
fg_bg_min_ratio = 4.5

# Minimum WCAG 2.2 contrast ratio for non-exempt ANSI palette slots (1..=7, 9..=15) vs bg (tunable).
# Source: W3C WCAG 2.2 SC 1.4.3 large-scale text / SC 1.4.11 Non-text Contrast (Level AA):
# https://www.w3.org/TR/WCAG22/#non-text-contrast
ansi_bg_min_ratio = 3.0

[day_phase]
# Piecewise-linear day phase `d` keyframes in [0.0, 1.0] aligned to `[solar.event_angles]`
# (`night` -> astronomical, nautical, civil twilight -> `golden` -> `day`, `PLAN.md` §4; tunable).
night_d = 0.0
nautical_d = 0.18
civil_d = 0.38
sunrise_sunset_d = 0.58
golden_d = 0.80
day_d = 1.0

# Upper cap (degrees, tunable) for `noon_elevation` normalization (`PLAN.md` §4).
# When `noon_elevation >= golden_hour_deg`, full `day` (`d = 1.0`) is reached at
# `min(noon_elevation, day_full_elevation_deg)` so low winter suns still reach `day` at noon while
# high summer suns reach `day` mid-morning.
day_full_elevation_deg = 24.0

# True-solar hour-angle half-width (degrees, tunable; 8 deg = 32 solar minutes) around solar noon
# and solar nadir used to cross-fade dawn and dusk smoothly during polar twilight / midnight sun.
culmination_blend_half_width_deg = 8.0

[season]
# Latitude threshold (degrees, tunable) across which seasonal amplitude fades smoothly to 0 at the
# equator (`PLAN.md` §4). Default is Earth's J2000.0 mean obliquity of the ecliptic (the Tropics of
# Cancer and Capricorn, 23°26'21.448").
# Source: Jean Meeus, Astronomical Algorithms (2nd ed., Ch. 22) / IAU J2000.0 obliquity.
equator_fade_latitude_deg = 23.439291
