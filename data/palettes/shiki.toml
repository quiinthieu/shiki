# Bundled `shiki` (四季, "four seasons") palette (`PLAN.md` §4, T06).
#
# Cool nocturnal ink, warm rose-gold dawn vs deeper copper-ember dusk (`dawn != dusk`), and airy
# seasonal daylight tints across spring (`s = 0.00`), summer (`s = 0.25`), autumn (`s = 0.50`), and
# winter (`s = 0.75`).
#
# Accessibility notes (`PLAN.md` §4, T17):
# - Every anchor and 2-D OKLCH blended frame meets WCAG AA contrast (`fg/bg >= 4.5:1`,
#   `selection >= 4.5:1`, `ansi 1..=7, 9..=15 vs bg >= 3.0:1`).
# - ANSI red (`1`, `9`) and ANSI green (`2`, `10`) are separated in perceptual lightness `L`
#   (green lighter than red by >= 0.08 in OKLab `L`), not solely by hue.

name = "shiki"
description = "Cool nocturnal ink, warm rose dawn and copper dusk, and seasonal daylight"

# ---------------------------------------------------------------------------
# Spring (`s = 0.00`) — misty pine night, lilac-dew dawn, celadon daylight, plum-apricot dusk
# ---------------------------------------------------------------------------

